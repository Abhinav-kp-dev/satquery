server {
    listen 80;
    client_max_body_size 500m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
    }
    location /renders/ {
        proxy_pass http://backend:8000;
    }
    location / {
        try_files $uri /index.html;
    }
}
